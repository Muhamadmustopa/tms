<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="TMS - Training Management System"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>
    Learning n Development 
  </title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>

  <!--
    Main Application
    Semua tampilan TMS akan dirender
    ke dalam element ini melalui JavaScript.
  -->
  <div id="app"></div>


  <!--
    JavaScript utama TMS

    type="module" digunakan karena
    app.js akan melakukan import dari:
    - config.js
    - functions.js
    - state.js
    - training-data.js
  -->
  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>
</html>
